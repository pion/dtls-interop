name: Interoperability

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interop:
    uses: ./.github/workflows/interop-tests.yaml
    with:
      interop-repository: ${{ github.repository }}
      interop-ref: ${{ github.sha }}
