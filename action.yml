name: Pion DTLS interoperability tests
description: Run the Pion DTLS interoperability suite against a DTLS checkout

inputs:
  dtls-path:
    description: Path to the pion/dtls checkout, relative to the caller workspace or absolute
    required: false
    default: .
  runner:
    description: Interop runner to execute (all, boringssl, wolfssl, openssl3, openssl4, pion-v3, pion-v4, mbedtls, or anvil)
    required: false
    default: all

runs:
  using: composite
  steps:
    - name: Read environment cache inputs
      id: environment
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        echo "hash=$(sha256sum action.yml devenv.nix devenv.yaml devenv.lock nix/*.nix | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        echo "devenv-rev=$(jq -r '.nodes.devenv.locked.rev' devenv.lock)" >> "$GITHUB_OUTPUT"

    - name: Install Nix
      uses: cachix/install-nix-action@v31

    - name: Configure the Devenv binary cache
      uses: cachix/cachix-action@v17
      with:
        name: devenv

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v7
      with:
        primary-key: nix-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-${{ steps.environment.outputs.hash }}
        restore-prefixes-first-match: nix-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-

    - name: Install Devenv
      shell: bash
      env:
        DEVENV_REV: ${{ steps.environment.outputs.devenv-rev }}
      run: nix profile add "github:cachix/devenv/$DEVENV_REV"

    - name: Restore and save Go modules and build cache
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/dtls-interop-go/mod
          ${{ runner.temp }}/dtls-interop-go/build
        key: go-interop-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-${{ steps.environment.outputs.hash }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          go-interop-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-${{ steps.environment.outputs.hash }}-${{ github.sha }}-
          go-interop-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-${{ steps.environment.outputs.hash }}-
          go-interop-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.runner }}-

    - name: Run DTLS interoperability tests
      shell: bash
      env:
        DTLS_PATH: ${{ inputs.dtls-path }}
        INTEROP_RUNNER: ${{ inputs.runner }}
        GOMODCACHE: ${{ runner.temp }}/dtls-interop-go/mod
        GOCACHE: ${{ runner.temp }}/dtls-interop-go/build
      run: |
        if [[ "$DTLS_PATH" != /* ]]; then
          DTLS_PATH="$GITHUB_WORKSPACE/$DTLS_PATH"
        fi

        cd "$GITHUB_ACTION_PATH"

        devenv --option interop.runner:string "$INTEROP_RUNNER" shell -- task interop "RUNNER=$INTEROP_RUNNER" -- "$DTLS_PATH"
