version: '3'

tasks:
  interop:
    desc: Run a Pion/dtls interop test
    silent: true
    env:
      PION_DTLS_SOURCE: '{{.CLI_ARGS}}'
      DTLS_INTEROP_RUNNER: '{{.RUNNER | default "all"}}'
    cmds:
      - |
        set -eu

        case "$DTLS_INTEROP_RUNNER" in
          all) test_pattern='.' ;;
          boringssl) test_pattern='^TestBoringSSL' ;;
          wolfssl) test_pattern='^TestWolfSSL' ;;
          *)
            echo "unknown interop runner: $DTLS_INTEROP_RUNNER (expected all, boringssl, or wolfssl)" >&2
            exit 1
            ;;
        esac

        source="$PION_DTLS_SOURCE"
        if [ -z "$source" ]; then
          exec go test -tags=interop -run "$test_pattern" .
        fi

        if [ -d "$source" ]; then
          dtls_directory="$source"
        else
          case "$source" in
            /*|..|../*|*/../*|*/..)
              echo "pion/dtls ref is not a checkout directory: $source" >&2
              exit 1
              ;;
          esac

          dtls_directory=".cache/pion-dtls/$source"
          if [ ! -e "$dtls_directory" ]; then
            task clone -- "$source" >/dev/null
          elif [ ! -d "$dtls_directory" ]; then
            echo "checkout path is not a directory: $dtls_directory" >&2
            exit 1
          fi
        fi

        project_directory="$(pwd -P)"
        dtls_directory="$(cd "$dtls_directory" && pwd -P)"
        workspace_directory="$(mktemp -d "${TMPDIR:-/tmp}/dtls-interop.XXXXXX")"
        (
          cd "$workspace_directory"
          go work init "$project_directory" "$dtls_directory"
        )

        status=0
        GOWORK="$workspace_directory/go.work" go test -tags=interop -run "$test_pattern" . || status=$?
        rm -rf -- "$workspace_directory"
        exit "$status"

  clone:
    desc: Clone a pion/dtls branch, tag, or commit into a new checkout
    silent: true
    env:
      PION_DTLS_REF: '{{.CLI_ARGS}}'
    cmds:
      - |
        set -eu

        ref="$PION_DTLS_REF"
        if [ -z "$ref" ]; then
          echo "usage: task clone -- <branch, tag, or commit>" >&2
          exit 1
        fi
        case "$ref" in
          /*|..|../*|*/../*|*/..)
            echo "invalid pion/dtls ref: $ref" >&2
            exit 1
            ;;
        esac

        destination=".cache/pion-dtls/$ref"
        if [ -e "$destination" ]; then
          echo "checkout already exists: $destination" >&2
          exit 1
        fi

        mkdir -p "$(dirname "$destination")"
        git init --quiet "$destination"
        git -C "$destination" fetch --quiet --depth=1 https://github.com/pion/dtls.git -- "$ref"
        git -C "$destination" checkout --quiet --detach FETCH_HEAD
        echo "PION_DTLS_DIR=$destination"
