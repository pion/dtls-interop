version: '3'

tasks:
  interop:boringssl13:
    desc: Run a BoringSSL-to-Pion DTLS 1.3 handshake and application record
    cmds:
      - go run . -mode boringssl-dtls13

  clone:
    desc: Clone a pion/dtls branch, tag, or commit into a new checkout
    silent: true
    cmds:
      - |
        set -eu

        ref='{{.CLI_ARGS}}'
        if [ -z "$ref" ]; then
          echo "usage: task pion:clone -- <branch, tag, or commit>" >&2
          exit 1
        fi

        destination=".cache/pion-dtls/$ref"
        if [ -e "$destination" ]; then
          echo "checkout already exists: $destination" >&2
          exit 1
        fi

        mkdir -p "$(dirname "$destination")"
        git init --quiet "$destination"
        git -C "$destination" fetch --quiet --depth=1 https://github.com/pion/dtls.git "$ref"
        git -C "$destination" checkout --quiet --detach FETCH_HEAD
        echo "PION_DTLS_DIR=$destination"
